version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: agriconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: agriconnect_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres_data: