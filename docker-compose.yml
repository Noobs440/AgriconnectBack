version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: agriconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7
    container_name: agriconnect_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
  db-ensure:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        until pg_isready -h postgres -U "$${PGUSER}" -d "$${PGDATABASE}"; do
          sleep 1;
        done;
        psql -h postgres -U "$${PGUSER}" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='$${PGDATABASE}'" | grep -q 1 || psql -h postgres -U "$${PGUSER}" -d postgres -c "CREATE DATABASE \"$${PGDATABASE}\";"
    restart: "no"

volumes:
  postgres_data: