services:
  - type: keyvalue
    name: agriconnect-redis
    plan: free
    ipAllowList: []

  - type: web
    name: agriconnect-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agriconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agriconnect-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        value: https://agri-connect-idbiv11fz-hyancinthe-kamtes-projects.vercel.app
      - key: FRONTEND_URLS
        value: https://agri-connect-rho-ruby.vercel.app,https://agri-connect-idbiv11fz-hyancinthe-kamtes-projects.vercel.app
      # Configure these values in the Render dashboard. Never commit SMTP secrets.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: agriconnect-db
    databaseName: agriconnect_db
    user: agriconnect