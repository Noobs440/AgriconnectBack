services:
  - type: web
    name: agriconnect-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agriconnect-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        value: https://agri-connect-rho-ruby.vercel.app

databases:
  - name: agriconnect-db
    databaseName: agriconnect_db
    user: agriconnect